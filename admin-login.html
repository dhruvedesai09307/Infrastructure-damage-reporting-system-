<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Infrastructure Damage Reports</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container { display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#f5f7fa 0%,#e9ecef 100%); }
    .login-card { background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:40px;box-shadow:0 10px 40px rgba(15,23,42,0.08);max-width:400px;width:100%; }
    .login-card h1 { text-align:center;margin:0 0 20px;font-size:1.6rem;color:#0f172a }
    .field-group { margin-bottom:16px }
    .login-error { color:#991b1b;background:#fee2e2;border:1px solid #fca5a5;padding:12px 16px;border-radius:12px;margin-bottom:12px;display:none }
    .login-back-link { text-align:center;margin-top:12px }
    .login-back-link a { color:#7c3aed;text-decoration:none;font-weight:600 }
  </style>
<style>.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:18px 6%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:1.2rem;font-weight:800;color:#1d4ed8}.nav{display:flex;gap:24px;align-items:center}.nav a{color:#475569;text-decoration:none;font-weight:600}.nav .button{background:#2563eb;color:#fff;padding:11px 18px;border-radius:9px}@media(max-width:760px){.topbar{display:block}.nav{margin-top:16px;gap:14px;flex-wrap:wrap}}</style></head>
<body>
<header class="topbar"><div class="brand">Infrastructure Report System</div><nav class="nav"><a href="reporthome.html">Home</a><a href="landing.html">About</a><a href="admin-login.html">Admin</a><a href="reportform.html">User Login</a><a class="button" href="index.html">Report an issue</a></nav></header>
  <div class="login-container">
    <div class="login-card">
      <h1>Admin Login</h1>
      <div id="loginError" class="login-error"></div>

      <form id="adminLoginForm">
        <div class="field-group">
          <label for="adminUsername">Username</label>
          <input type="text" id="adminUsername" required placeholder="admin username">
        </div>
        <div class="field-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" required placeholder="password">
        </div>
        <button type="submit">Login as Admin</button>
      </form>

      <div class="login-back-link">
        <a href="reporthome.html">← Back to Report Home</a>
      </div>
    </div>
  </div>

  <script src="admin-login.js"></script>
</body>
</html>
