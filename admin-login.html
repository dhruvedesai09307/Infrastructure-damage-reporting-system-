<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login · Infrastructure Damage Reporting</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{box-sizing:border-box;font-family:'Poppins',sans-serif;margin:0;padding:0}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F4F6;color:#374151}
    .card{width:min(440px,92%);padding:40px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    .brand-title{text-align:center;font-size:24px;font-weight:700;color:#111827;margin-bottom:6px}
    .subtitle{text-align:center;color:#6B7280;font-size:14px;margin-bottom:24px}
    .field{margin:18px 0}
    .field label{display:block;margin-bottom:8px;font-weight:600;font-size:14px;color:#374151}
    .field input{width:100%;padding:12px 14px;border:1px solid #D1D5DB;border-radius:10px;font-size:15px;background:#F9FAFB;color:#111827;outline:none}
    .field input:focus{border-color:#2563EB;background:#fff}
    .button{width:100%;padding:14px;border:0;border-radius:10px;background:#2F3B4A;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;margin-top:10px}
    .button:hover{background:#1F2937}
    .error{display:none;background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px;text-align:center}
    .back{display:inline-flex;align-items:center;gap:6px;color:#4B5563;text-decoration:none;margin-top:22px;font-size:14px;font-weight:500}
    .back:hover{color:#111827}
  </style>
</head>
<body>
  <main class="card">
    <div style="text-align:center;margin-bottom:16px;"><i class="fas fa-user-shield" style="font-size:36px;color:#2F3B4A;"></i></div>
    <h1 class="brand-title">Admin Access</h1>
    <p class="subtitle">Manage infrastructure damage reports</p>
    <div id="loginError" class="error" role="alert"></div>
    <form id="adminLoginForm">
      <div class="field"><label for="adminUsername">Username</label><input id="adminUsername" placeholder="e.g. sujal" required autocomplete="username"></div>
      <div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
      <button class="button" type="submit"><i class="fas fa-right-to-bracket"></i> Login as Admin</button>
    </form>
    <div style="text-align:center;">
      <a class="back" href="home-page.html"><i class="fas fa-arrow-left"></i> Back to home</a>
    </div>
  </main>
  <script src="admin-login.js"></script>
</body>
</html>
