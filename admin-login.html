<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    body{font-family:'Poppins',sans-serif;background:#FFFFFF;color:#6B7280;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .login-card{background:#FFFFFF;padding:30px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);width:300px}
    .login-card h2{text-align:center;margin-bottom:20px;color:#6B7280}
    .login-card input{width:100%;padding:10px;margin:10px 0;border:1px solid #E5E7EB;border-radius:5px}
    .login-card button{background:#6B7280;color:white;border:none;padding:10px 20px;border-radius:5px;width:100%;cursor:pointer}
    .login-card button:hover{background:#4B5563}
    .error{color:#EF4444;margin-top:10px;text-align:center}
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <form id="adminLoginForm">
      <input type="text" id="adminUsername" placeholder="Username" required>
      <input type="password" id="adminPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div id="loginError" class="error" style="display:none;"></div>
  </div>
  <script src="admin-login.js"></script>
</body>
</html>
