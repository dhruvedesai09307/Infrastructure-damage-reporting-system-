<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Security Access · IDRS Command Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;margin:0;padding:0}
    body{
      margin:0;
      min-height:100vh;
      background:#090D16;
      background-image:
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color:#F8FAFC;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(440px,100%);
      padding:44px 38px;
      background:#0F172A;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:24px;
      box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(59,130,246,0.15);
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:4px;
      background:linear-gradient(90deg, #3B82F6, #8B5CF6, #10B981);
    }
    .brand-icon-wrap{
      width:58px;
      height:58px;
      border-radius:16px;
      background:linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:24px;
      margin:0 auto 18px;
      box-shadow:0 8px 20px rgba(59,130,246,0.4);
    }
    .brand-title{text-align:center;font-size:24px;font-weight:800;color:#F8FAFC;margin-bottom:6px;letter-spacing:-0.4px}
    .subtitle{text-align:center;color:#94A3B8;font-size:16px;margin-bottom:28px}
    .field{margin:18px 0}
    .field label{display:block;margin-bottom:8px;font-weight:600;font-size:14px;color:#CBD5E1}
    .input-wrap{position:relative;display:flex;align-items:center;}
    .input-wrap i.prefix-icon{position:absolute;left:14px;color:#64748B;font-size:16px;}
    .field input{
      width:100%;
      padding:12px 14px 12px 40px;
      border:1px solid rgba(255,255,255,0.12);
      border-radius:12px;
      font-size:16px;
      background:#1E293B;
      color:#F8FAFC;
      outline:none;
      transition:all .2s;
    }
    .field input:focus{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,0.25);background:#141E33}
    .button{
      width:100%;
      padding:14px;
      border:0;
      border-radius:12px;
      background:linear-gradient(135deg, #3B82F6, #2563EB);
      color:#FFFFFF;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:all .2s;
      margin-top:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      box-shadow:0 4px 16px rgba(59,130,246,0.35);
    }
    .button:hover{transform:translateY(-1px);filter:brightness(1.1);box-shadow:0 6px 20px rgba(59,130,246,0.45)}
    .error{
      display:none;
      background:rgba(239, 68, 68, 0.15);
      border:1px solid rgba(239, 68, 68, 0.3);
      color:#FCA5A5;
      padding:12px;
      border-radius:12px;
      font-size:14px;
      margin-bottom:18px;
      text-align:center;
      animation:shake .3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:#94A3B8;
      text-decoration:none;
      margin-top:24px;
      font-size:14px;
      font-weight:600;
      transition:color .2s;
    }
    .back:hover{color:#F8FAFC}
    .badge-bar{
      margin-top:20px;
      padding-top:16px;
      border-top:1px solid rgba(255,255,255,0.08);
      text-align:center;
      font-size:14px;
      color:#64748B;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-icon-wrap">
      <i class="fas fa-shield-halved"></i>
    </div>
    <h1 class="brand-title">Admin Command Access</h1>
    <p class="subtitle">Municipal Infrastructure Damage Reporting System</p>
    
    <div id="loginError" class="error" role="alert"></div>
    
    <form id="adminLoginForm">
      <div class="field">
        <label for="adminUsername">Administrator Username</label>
        <div class="input-wrap">
          <i class="fas fa-user-shield prefix-icon"></i>
          <input id="adminUsername" placeholder="e.g. sujal" required autocomplete="username">
        </div>
      </div>
      
      <div class="field">
        <label for="adminPassword">Security Key / Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock prefix-icon"></i>
          <input id="adminPassword" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>
      
      <button class="button" type="submit"><i class="fas fa-right-to-bracket"></i> Authenticate & Enter Suite</button>
    </form>
    
    <div style="text-align:center;">
      <a class="back" href="home-page.html"><i class="fas fa-arrow-left"></i> Return to Citizen Portal</a>
    </div>

    <div class="badge-bar">
      <span><i class="fas fa-lock" style="color:#10B981;margin-right:4px;"></i> 256-Bit Encrypted Admin Session</span>
    </div>
  </main>
  <script src="admin-login.js"></script>
</body>
</html>
