<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Create Account | Infrastructure Damage Reporting System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome 6, Bootstrap Icons, Remix Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
  <!-- IDRS AI Chatbot Assistant & Universal Theme Styles -->
  <link rel="stylesheet" href="chatbot.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; background:#F3F4F6; color:#374151; display:flex; flex-direction:column; align-items:center; font-family:'Poppins',sans-serif; }
    .card { width:min(440px,92%); padding:40px; background:#FFFFFF; border:1px solid #E5E7EB; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,.08); margin:auto; }
    .logo-badge { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; text-decoration:none; }
    .logo-badge i { font-size:30px; color:#2563EB; }
    .logo-badge span { font-size:24px; font-weight:800; color:#111827; letter-spacing:-0.5px; }
    h1 { text-align:center; font-size:28px; font-weight:800; color:#111827; margin-bottom:6px; }
    h1 span { color:#2563EB; }
    .subtitle { text-align:center; color:#6B7280; font-size:16px; margin-bottom:24px; }
    .field { margin:18px 0; }
    .field label { display:block; margin-bottom:8px; font-weight:600; font-size:14px; }
    .field input { width:100%; padding:12px 14px; border:1.5px solid #E5E7EB; border-radius:10px; font-size:16px; background:#F9FAFB; outline:none; transition:.2s; }
    .field input:focus { border-color:#2563EB; background:#fff; box-shadow:0 0 0 4px rgba(37,99,235,0.12); }
    .button { width:100%; padding:14px; border:0; border-radius:10px; background:#2563EB; color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px; box-shadow:0 4px 14px rgba(37,99,235,0.25); transition:.2s; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .button:hover { background:#1D4ED8; transform:translateY(-1px); }
    .msg { display:none; padding:12px; border-radius:10px; font-size:14px; margin-bottom:16px; text-align:center; }
    .error { background:#fee2e2; color:#991b1b; }
    .success { background:#dcfce7; color:#166534; }
    .back { display:block; text-align:center; margin-top:22px; color:#4B5563; text-decoration:none; font-size:14px; font-weight:500; transition:.2s; }
    .back:hover { color:#2563EB; }
  </style>
</head>
<body>
  <div class="floating-theme-toggle">
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
      <svg class="theme-icon-svg" id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
  <main class="card">
    <a href="home-page.html" class="logo-badge">
      <svg class="idrs-road-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19 8.5 5"></path><path d="M20 19 15.5 5"></path><line x1="12" y1="6" x2="12" y2="8.5"></line><line x1="12" y1="12" x2="12" y2="14.5"></line><line x1="12" y1="18" x2="12" y2="20.5"></line></svg>
      <span>IDRS</span>
    </a>
    <h1>Create <span>Account</span></h1>
    <p class="subtitle">Register to report and track infrastructure issues</p>
    <div id="msgBox" class="msg" role="alert"></div>
    <form id="registerForm">
      <div class="field"><label for="name">Full Name</label><input id="name" required></div>
      <div class="field"><label for="email">Email Address</label><input id="email" type="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required></div>
      <button class="button" type="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        Create Account
      </button>
    </form>
    <a class="back" href="login-page.html">Already have an account? Login</a>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById('msgBox');
      msgBox.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const result = await res.json();

        msgBox.style.display = 'block';
        if (result.success) {
          msgBox.className = 'msg success';
          msgBox.textContent = 'Account created! Redirecting to login...';
          setTimeout(() => window.location.href = 'login-page.html', 1500);
        } else {
          msgBox.className = 'msg error';
          msgBox.textContent = result.message || 'Registration failed.';
        }
      } catch (err) {
        msgBox.style.display = 'block';
        msgBox.className = 'msg error';
        msgBox.textContent = 'Could not connect to server.';
      }
    });
  </script>
  <!-- IDRS AI Chatbot Assistant -->
  <script src="chatbot.js"></script>
</body>
</html>
