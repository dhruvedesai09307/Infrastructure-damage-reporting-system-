<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | Infrastructure Report System</title><link rel="stylesheet" href="styles.css"><style>.profile{max-width:900px;margin:auto;padding:42px 24px}.profile-head{background:linear-gradient(135deg,#1e3a8a,#2454d6);color:#fff;border-radius:20px;padding:32px;margin-bottom:28px}.profile-head h1{margin:0 0 8px}.report-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin:12px 0}.muted{color:#64748b}.logout{float:right;background:#fff;color:#183fa8;padding:10px 16px;border-radius:8px;border:0;font-weight:700}</style><style>.topbar{background:linear-gradient(135deg,#5575d2,#2454d6);border-bottom:1px solid #e2e8f0;padding:18px 6%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:1.2rem;font-weight:800;color:#183fa8}.nav{display:flex;gap:24px;align-items:center}.nav a{color:#fff;text-decoration:none;font-weight:600}.nav .button{background:#fff;color:#183fa8;padding:11px 18px;border-radius:9px}@media(max-width:760px){.topbar{display:block}.nav{margin-top:16px;gap:14px;flex-wrap:wrap}}</style></head><body>
<header class="topbar"><div class="brand">Infrastructure Report System</div><nav class="nav"><a href="reporthome.html">Home</a><a href="landing.html">About</a><a href="admin-login.html">Admin</a><a href="mainlogin.html">User Login</a><a class="button" href="reportform.html">Report an issue</a></nav></header><main class="profile"><section class="profile-head"><button class="logout" id="logout">Log out</button><h1>My profile</h1><p id="userEmail"></p></section><h2>My submitted reports</h2><div id="reports"><p class="muted">Loading reports…</p></div></main><script>
const user=JSON.parse(sessionStorage.getItem('currentUser')||'null');if(!user){location.href='mainlogin.html'}else{document.getElementById('userEmail').textContent=user.email;fetch('/api/reports').then(r=>r.json()).then(reports=>{const mine=reports.filter(r=>r.email.toLowerCase()===user.email);document.getElementById('reports').innerHTML=mine.length?mine.map(r=>`<article class="report-card"><strong>${r.category}</strong><p>${r.state}, ${r.city} · ${r.location}</p><p class="muted">${r.severity} · ${new Date(r.submittedAt).toLocaleString()}</p><p>${r.description}</p><small>Reference: ${r.id}</small></article>`).join(''):'<p class="muted">You have not submitted any reports yet.</p>'}).catch(()=>document.getElementById('reports').innerHTML='<p class="muted">Start the local server to load your reports.</p>')}document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('currentUser');location.href='reporthome.html'};
</script></body></html>
