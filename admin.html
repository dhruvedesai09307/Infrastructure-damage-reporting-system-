<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;font-family:Poppins,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0047ab,#0a66c2,#6cb4ee);color:#fff}.top{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;background:#ffffff25;backdrop-filter:blur(15px)}.top a{color:#fff}.wrap{max-width:1050px;margin:auto;padding:42px 24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat,.report{background:#ffffff25;backdrop-filter:blur(15px);border:1px solid #ffffff44;border-radius:16px;padding:22px}.stat strong{font-size:2rem;display:block}.toolbar{margin:26px 0;display:flex;gap:12px}.button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.danger{background:#ef4444;color:#fff}.light{background:#fff;color:#0047ab}.report{margin:14px 0}.muted{opacity:.8}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{display:block}}</style></head><body><header class="top"><strong>Infrastructure Report System · Admin</strong><a href="mainlogin.html">Home</a></header><main class="wrap"><h1>Admin Dashboard</h1><div class="stats"><div class="stat"><strong id="total">0</strong>Total Reports</div><div class="stat"><strong id="critical">0</strong>Critical Reports</div><div class="stat"><strong id="resolved">0%</strong>Resolution Rate</div></div><div class="toolbar"><button class="button light" id="logout">Logout</button><button class="button danger" id="clear">Clear Reports</button></div><section id="list"><p class="muted">Loading reports...</p></section></main><script>if(sessionStorage.getItem('adminLoggedIn')!=='true')location.href='admin-login.html';const reports=()=>JSON.parse(localStorage.getItem('reports')||'[]');function render(){const data=reports();total.textContent=data.length;critical.textContent=data.filter(r=>String(r.severity).startsWith('Critical')).length;list.innerHTML=data.length?data.slice().reverse().map(r=>`<article class="report"><strong>${r.category||'Infrastructure issue'}</strong><p>${r.state||''}, ${r.city||''} · ${r.location||''}</p><p>${r.description||''}</p><small>Submitted by ${r.fullName||'User'} · ${r.email||''}</small></article>`).join(''):'<p class="muted">No reports submitted yet.</p>'}render();logout.onclick=()=>{sessionStorage.removeItem('adminLoggedIn');location.href='admin-login.html'};clear.onclick=()=>{if(confirm('Clear all reports?')){localStorage.removeItem('reports');render()}}</script></body></html>
