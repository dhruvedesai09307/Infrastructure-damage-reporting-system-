<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Admin - Reports</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<main class="container">
		<section class="hero">
			<h1>Admin — Submitted Reports</h1>
			<p>Sign in to view submitted infrastructure reports (local demo only).</p>
			<p style="margin-top:12px;font-size:0.9rem"><a href="index.html" style="color:#7c3aed;text-decoration:none;font-weight:500">Back to Report Form</a></p>
		</section>

		<div id="loginBox">
			<label for="adminUser">Admin Username</label>
			<input id="adminUser" type="text" placeholder="Enter username" />
			<label for="adminPass">Admin Password</label>
			<input id="adminPass" type="password" placeholder="Enter password" />
			<div style="margin-top:16px">
				<button id="loginBtn">Sign In</button>
			</div>
		</div>

		<section id="adminArea" class="hidden">
			<div style="display:flex;justify-content:space-between;align-items:center">
				<h2>Reports</h2>
				<div>
					<button id="logoutBtn" style="margin-right:8px">Logout</button>
					<button id="clearBtn">Clear All</button>
				</div>
			</div>

			<div id="reportsList"></div>
		</section>
	</main>

	<script src="admin.js"></script>
</body>
</html>
