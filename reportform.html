<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Infrastructure Damage Reports</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
    }
    
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
      max-width: 400px;
      width: 100%;
    }
    
    .login-card h1 {
      text-align: center;
      margin: 0 0 30px;
      font-size: 1.8rem;
      color: #0f172a;
    }
    
    .login-card .field-group {
      margin-bottom: 20px;
    }
    
    .login-card button {
      width: 100%;
      margin-top: 10px;
    }
    
    .login-error {
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
    }
    
    .login-back-link {
      text-align: center;
      margin-top: 20px;
    }
    
    .login-back-link a {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    
    .login-back-link a:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>User Login</h1>
      
      <div id="loginError" class="login-error"></div>
      
      <form id="loginForm">
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password (min 6 chars)" required>
        </div>

        <div class="field-group" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember" style="margin:0;">Remember me</label>
        </div>

        <button type="submit">Sign In</button>
      </form>

      <div class="login-back-link" style="text-align:center;margin-top:20px;">
        <a href="reporthome.html">← Back to Report Home</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
